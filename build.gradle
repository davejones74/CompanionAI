plugins {
    id 'java'
    id 'application'
}

group = 'davejones74.campanionai'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:10.1.34'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.23.1'
    implementation 'org.jsoup:jsoup:1.18.3'
}

application {
    mainClass = 'davejones74.campanionai.Server'
}

tasks.register('shutdown') {
    doLast {
        def port = System.getProperty('campanionai.port', '8080')
        def host = System.getProperty('campanionai.host', 'localhost')
        if (host == '0.0.0.0') host = 'localhost'
        def url = "http://${host}:${port}/api/shutdown"
        try {
            def conn = new URL(url).openConnection()
            conn.requestMethod = 'POST'
            conn.connectTimeout = 3000
            conn.readTimeout = 30000
            def code = conn.responseCode
            if (code == 200) {
                conn.inputStream.text
                println "CompanionAI shut down: ${url}"
            } else {
                def body = conn.errorStream?.text ?: ''
                println "Shutdown failed: HTTP ${code} ${body}"
            }
        } catch (Exception e) {
            println "No running CompanionAI found at ${url} (already stopped?)"
        }
    }
}