# CompanionAI locations for the existing x1pro.runningcode.dev server block.
#
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp deploy/nginx/companionai-locations.conf /etc/nginx/snippets/
#   # then add this ONE line inside the server { } block of sites-enabled/x1pro:
#   include /etc/nginx/snippets/companionai-locations.conf;
#
# This is a location fragment, not a whole server block. x1pro.runningcode.dev
# already has a certificate and a default page, so a second server block with the
# same server_name on the same port would simply lose to whichever one nginx loads
# first. There is also no `upstream` block here: those belong in the http context,
# and this file is included inside server{}.

# The app's HTML calls absolute URLs -- fetch('/api/stats'),
# fetch('/api/chat/stream'), fetch('/upload') -- so those paths must be routable at
# the domain root too, not only under the prefix. Without them the page loads and
# then every request fails.

location = /companionAI {
    return 301 /companionAI/;
}

location /companionAI/ {
    client_max_body_size 12m;
    # Trailing slash on proxy_pass strips the /companionAI prefix, so Tomcat sees /
    proxy_pass http://127.0.0.1:8080/;

    # SSE. proxy_buffering and gzip are the load-bearing pair: with either one on,
    # nginx holds the whole response before forwarding a byte, which turns a
    # word-by-word stream into one lump arriving at the end.
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    chunked_transfer_encoding on;

    # HTTP/1.1 with an empty Connection header keeps the upstream connection
    # reusable; the default here would be HTTP/1.0 plus Connection: close.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A generation can sit idle between deltas while the NPU decodes.
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_connect_timeout 5s;
}

location /api/ {
    client_max_body_size 12m;
    proxy_pass http://127.0.0.1:8080;
    proxy_buffering off;
    gzip off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 900s;
    proxy_connect_timeout 5s;
}

location /upload {
    client_max_body_size 12m;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
}

# FastFlowLM runs on 127.0.0.1:52625 and is deliberately never proxied. This denies
# it explicitly in case an upstream is ever added here by mistake.
location /v1/ {
    return 404;
}
