# CompanionAI public entry point.
#
#   sudo cp deploy/nginx/companionai.conf /etc/nginx/sites-available/companionai
#   sudo ln -s /etc/nginx/sites-available/companionai /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# FastFlowLM has no proxy in front of it by design: no auth, no rate limit, so it
# must never be reachable from here. Only CompanionAI gets a server block.

upstream companionai_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

# HTTP exists for the ACME challenge and to redirect everything else.
server {
    listen 80;
    listen [::]:80;
    server_name companionai.runningcode.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name companionai.runningcode.dev;

    ssl_certificate     /etc/letsencrypt/live/companionai.runningcode.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/companionai.runningcode.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer" always;

    # A streamed generation can sit idle between deltas while the NPU decodes.
    proxy_read_timeout 900s;

    location / {
        proxy_pass http://companionai_app;

        # SSE correctness. proxy_buffering is the one that matters: with it on,
        # Nginx reads the whole response from CompanionAI before forwarding a byte,
        # which turns a word-by-word stream into one lump arriving at the end.
        proxy_buffering off;
        proxy_cache off;

        # Compression must be off for the same reason: gzip needs a full buffer
        # before it can emit anything.
        gzip off;

        chunked_transfer_encoding on;

        # HTTP/1.1 and an empty Connection header let the upstream connection be
        # reused. Without the upgrade to 1.1 this defaults to 1.0 plus
        # Connection: close, which is incompatible with keepalive.
        proxy_http_version 1.1;
        proxy_set_header Connection        "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_send_timeout 900s;
        proxy_connect_timeout 5s;
    }

    # Belt and braces: make the model runtime unmistakably unreachable through Nginx
    # even if someone later adds an upstream pointing at it by mistake.
    location /v1/ {
        return 404;
    }
}