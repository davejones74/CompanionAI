# CompanionAI HTTP bootstrap. Loaded BEFORE the certificate exists.
#
#   sudo cp deploy/nginx/companionai-http.conf /etc/nginx/sites-available/companionai
#   sudo ln -sf /etc/nginx/sites-available/companionai /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --webroot -w /var/www/acme -d companionai.runningcode.dev
#   # then install companionai.conf and reload again
#
# This file exists to break a bootstrap deadlock. companionai.conf cannot be loaded
# before the certificate exists -- nginx refuses to start on a missing ssl_certificate.
# certbot cannot issue before nginx serves the challenge on port 80. Keeping the two
# halves in separate files means the half with no certificate dependency can be
# deployed first, so the deadlock has a starting edge.

server {
    listen 80;
    listen [::]:80;
    server_name companionai.runningcode.dev;

    # Satisfies the HTTP-01 challenge. certbot --webroot writes here, and this
    # location must be live for the challenge to succeed. Note it is an exact prefix
    # match on the directory, so it takes precedence over the redirect below.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    # Everything else is redirected to HTTPS. Before the certificate is issued this
    # sends browsers to a host that is not listening on 443 yet, which is harmless and
    # temporary.
    location / {
        return 301 https://$host$request_uri;
    }
}